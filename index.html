<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibrahim Toys & Cosmetics — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B1533">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ibrahim Toys">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <img src="img/logo-256.png" alt="Ibrahim Toy &amp; Cosmetic Shop" class="auth-logo-img">
    <h1 class="auth-title">Ibrahim Toy &amp;<br>Cosmetic Shop</h1>
    <p class="auth-tagline">Toys for Fun, Beauty for Everyone</p>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="auth-field">
        <span class="auth-field-icon">👤</span>
        <input type="email" id="email" required autocomplete="username" placeholder="admin@ibrahimtoys.com">
      </div>
      <div class="auth-field">
        <span class="auth-field-icon">🔒</span>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="auth-field-eye" id="togglePasswordBtn" aria-label="Show password">👁</button>
      </div>

      <div class="auth-row">
        <label class="auth-checkbox">
          <input type="checkbox" id="rememberMe" checked>
          Remember Me
        </label>
        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-gradient" id="loginBtn">↪ Login</button>
    </form>

    <div class="auth-divider"><span>OR</span></div>

    <button type="button" class="btn btn-outline-block" id="createAccountBtn">+ Create New Account</button>

    <div class="auth-features">
      <div class="auth-feature"><span>🛡️</span><strong>Secure Login</strong><small>Your data is safe with us</small></div>
      <div class="auth-feature"><span>🛍️</span><strong>Quality Products</strong><small>Toys &amp; Cosmetics best quality</small></div>
      <div class="auth-feature"><span>🎧</span><strong>24/7 Support</strong><small>We are here to help you</small></div>
    </div>

    <div class="auth-footer" id="authFooter">© Ibrahim Toy &amp; Cosmetic Shop · All Rights Reserved</div>
  </div>
</div>

<div class="toast" id="authToast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("authFooter").textContent =
    "© " + new Date().getFullYear() + " Ibrahim Toy & Cosmetic Shop · All Rights Reserved";

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  }
</script>
</body>
</html>
