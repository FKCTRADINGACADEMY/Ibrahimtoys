<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Ibrahim Toys & Cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E1B4B">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ibrahim Toys">
</head>
<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> Ibrahim Toys</div>
    <nav class="nav-group">
      <button class="nav-item active" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Overview
      </button>
      <button class="nav-item" data-view="inventory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 8l-8-5-8 5v8l8 5 8-5V8z"/><path d="M12 12l8-5M12 12v9M12 12L4 7"/></svg>
        Inventory
      </button>
    </nav>
    <div class="sidebar-foot">
      Logged in as admin.<br>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px; color:#fff; border-color:rgba(255,255,255,0.25); width:100%; justify-content:center;" onclick="logout()">Logout</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle icon-btn" id="menuToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 class="page-title" id="pageTitle">Overview</h1>
      </div>
      <div class="topbar-right">
        <span class="status-pill" id="statusPill"><span class="blip"></span> Online</span>
        <button class="btn btn-ghost btn-sm" id="installBtn" style="display:none;">⭳ Install App</button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <!-- OVERVIEW VIEW -->
    <section id="view-overview">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label"><span class="stat-swatch" style="background:var(--ink)"></span> Total Products</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><span class="stat-swatch" style="background:var(--toy-amber)"></span> Toys</div>
          <div class="stat-value" id="statToys">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><span class="stat-swatch" style="background:var(--cosmetic-rose)"></span> Cosmetics</div>
          <div class="stat-value" id="statCosmetics">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><span class="stat-swatch" style="background:var(--danger)"></span> Low Stock</div>
          <div class="stat-value" id="statLow">0</div>
        </div>
      </div>

      <div class="stat-grid" style="grid-template-columns: 1fr;">
        <div class="stat-card">
          <div class="stat-label">Total Stock Value (cost price)</div>
          <div class="stat-value" id="statValue">Rs. 0</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Low Stock Alerts</h3></div>
        <div id="lowStockList"></div>
      </div>
    </section>

    <!-- INVENTORY VIEW -->
    <section id="view-inventory" style="display:none;">
      <div class="panel">
        <div class="panel-head">
          <div class="chip-group" id="filterChips">
            <button class="chip active" data-cat="All">All</button>
            <button class="chip" data-cat="Toys">Toys</button>
            <button class="chip" data-cat="Cosmetics">Cosmetics</button>
            <button class="chip" data-cat="Low">Low Stock</button>
          </div>
          <div class="toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" id="searchInput" placeholder="Search product or SKU...">
            </div>
            <button class="btn btn-primary" id="addProductBtn">+ Add Product</button>
          </div>
        </div>
        <div id="productGrid" class="product-grid"></div>
      </div>
    </section>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Add Product</h3>
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="field">
        <label for="pName">Product Name</label>
        <input type="text" id="pName" required placeholder="e.g. Remote Control Car">
      </div>
      <div class="form-row">
        <div class="field">
          <label for="pSku">SKU / Code</label>
          <input type="text" id="pSku" required placeholder="TOY-001">
        </div>
        <div class="field">
          <label for="pCategory">Category</label>
          <select id="pCategory" required>
            <option value="Toys">Toys</option>
            <option value="Cosmetics">Cosmetics</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="pCost">Cost Price (Rs.)</label>
          <input type="number" id="pCost" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label for="pPrice">Sale Price (Rs.)</label>
          <input type="number" id="pPrice" min="0" step="0.01" required>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="pStock">Current Stock</label>
          <input type="number" id="pStock" min="0" required>
        </div>
        <div class="field">
          <label for="pThreshold">Low Stock Alert Below</label>
          <input type="number" id="pThreshold" min="0" required value="5">
        </div>
      </div>
      <div class="field">
        <label for="pSupplier">Supplier (optional)</label>
        <input type="text" id="pSupplier" placeholder="e.g. Al-Karam Traders">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveProductBtn">Save Product</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/inventory.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  }

  // "Add to Home Screen" install prompt
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = "inline-flex";
  });

  installBtn?.addEventListener("click", async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = "none";
  });

  window.addEventListener("appinstalled", () => {
    installBtn.style.display = "none";
  });
</script>
</body>
</html>
